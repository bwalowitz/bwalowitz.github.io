    :root {

      --radius: 12px;
    }
    * { box-sizing: border-box; }

      margin: 0;
      font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: var(--bg);
      line-height: 1.55;
    }
    .container { max-width: 980px; margin: 32px auto; padding: 0 16px 40px; }
    header { text-align: center; margin-bottom: 22px; }
    h1 { font-size: 28px; margin: 10px 0 6px; letter-spacing: .2px; }
    p.lead { color: var(--muted); margin: 0; }

    .panel {
      background: var(--card);
      border: 1px solid #262626;
      border-radius: var(--radius);
      padding: 16px;
    }

    .controls { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    input[type="number"] {
      padding: 12px 14px; font-size: 16px; width: 100%; border-radius: 10px;
      border: 1px solid #333; background: #0b0b0b; color: var(--text);
      outline: none; transition: border-color .15s ease;
    }
    input[type="number"]:focus { border-color: #fff; }
    button.primary {
      padding: 12px 16px; font-size: 16px; border: 1px solid #fff; border-radius: 10px; cursor: pointer;
      color: #000; background: #fff;
    }
    button.primary:hover { background: #e5e5e5; }

    .quick-years { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-size: 14px; padding: 8px 10px; border: 1px solid #333; border-radius: 999px; color: var(--muted); cursor: pointer; background: transparent; }
    .chip:hover { color: var(--text); border-color: #444; }

    .results { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid #262626; border-radius: 14px; padding: 16px; }
    .kicker { font-size: 12px; letter-spacing: .2px; color: var(--muted); text-transform: uppercase; }
    .title { font-size: 16px; font-weight: 700; margin: 6px 0 6px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid #444; color: var(--text); background: transparent; }
    .pill.bad { border-color: #ef4444; }
    .pill.warn { border-color: #eab308; }
    .pill.good { border-color: #22c55e; }
    .desc { font-size: 14px; color: #e6e6e6; }
    .now { font-size: 13px; color: #cfcfcf; margin-top: 6px; }
    .sources { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .sources a { color: #fff; text-decoration: underline; font-size: 12px; }

    .empty { text-align: center; color: var(--muted); font-size: 15px; padding: 18px; border: 1px dashed #2a2a2a; border-radius: 12px; }

    footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: #fff; text-decoration: underline; }
    .row { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 760px) { .row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>

    </section>

    <footer>
      <span>crafted by <a href="https://brandonwalowitz.com" target="_blank" rel="noopener">Brandon Walowitz</a></span>
    </footer>
  </div>

const TAG_COLORS = {
  Debunked: 'bad',
  Reclassified: 'good',
  Revised: 'warn',
  Nuanced: 'warn'
};

const PAGE_SIZE = 6;

function splitByYear(gradYear) {
  const y = Number(gradYear);
  const valid = !!y && y >= 1900 && y <= 2100;
  if (!valid) return { relevant: DATA.slice(), background: [] };
  const relevant = DATA.filter(item => typeof item.changedYear === 'number' && y < item.changedYear);
  const background = DATA.filter(item => !(typeof item.changedYear === 'number' && y < item.changedYear));
  return { relevant, background };
}

function sample(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, Math.max(0, Math.min(n, a.length)));
}

function chooseDiverse(items, n, maxPerCategory = 1) {
  const out = [];
  const perCat = new Map();
  for (const item of sample(items, items.length)) {
    const cat = item.category || '_';
    const count = perCat.get(cat) || 0;
    if (count >= maxPerCategory) continue;
    out.push(item);
    perCat.set(cat, count + 1);
    if (out.length >= n) break;
  }
  return out;
}

function getSeen(year) {
  const key = 'osf_seen_' + String(year || 'any');
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch (e) { return new Set(); }
}
function addSeen(year, ids) {
  const key = 'osf_seen_' + String(year || 'any');
  try {
    const prev = JSON.parse(localStorage.getItem(key) || '[]');
    const s = new Set(prev);
    ids.forEach(id => s.add(id));
    localStorage.setItem(key, JSON.stringify(Array.from(s)));
  } catch (e) {}
}
function clearSeen(year) {
  const key = 'osf_seen_' + String(year || 'any');
  try { localStorage.removeItem(key); } catch (e) {}
}

function pickForYear(year) {
  const { relevant, background } = splitByYear(year);
  const seen = getSeen(year);
  const relUnseen = relevant.filter(i => !seen.has(i.id));
  const bgUnseen = background.filter(i => !seen.has(i.id));

  const wantRelevant = Math.min(PAGE_SIZE, 4);
  let chosen = chooseDiverse(relUnseen, wantRelevant, 1);
  let remaining = PAGE_SIZE - chosen.length;
  if (remaining > 0) {
    chosen = chosen.concat(chooseDiverse(bgUnseen, remaining, 1));
  }
  // If we couldn't fill the page because we ran out of unseen, reset and fill from full pools while avoiding duplicates in this batch
  if (chosen.length < PAGE_SIZE) {
    clearSeen(year);
    const already = new Set(chosen.map(x => x.id));
    const extraRel = chooseDiverse(relevant.filter(x => !already.has(x.id)), wantRelevant - chosen.filter(x => relevant.includes(x)).length, 1);
    chosen = chosen.concat(extraRel);
    remaining = PAGE_SIZE - chosen.length;
    if (remaining > 0) {
      const extraBg = chooseDiverse(background.filter(x => !already.has(x.id)), remaining, 1);
      chosen = chosen.concat(extraBg);
    }
  }
  return chosen.slice(0, PAGE_SIZE);
}

function byYear(gradYear) {
  const y = Number(gradYear);
  if (!y || y < 1900 || y > 2100) return [];
  return DATA.filter(item => typeof item.changedYear === 'number' ? y < item.changedYear : true);
}

function render(list, year) {
  const wrap = document.getElementById('results');
  if (!list.length) {
    wrap.innerHTML = `<div class="empty">No obvious items for ${year}. Try an earlier year.</div>`;
    return;
  }
  wrap.innerHTML = list.map(i => `
    <article class="card">
      <div class="kicker">${i.category}</div>
      <div class="title">${i.title}</div>
      <div class="meta">
        <span class="pill ${TAG_COLORS[i.status] || ''}">${i.status}</span>
        ${i.changedYear ? `<span class="pill">Change noted: ${i.changedYear}</span>` : ''}
      </div>
      <div class="desc">${i.was}</div>
      <div class="now"><strong>Today:</strong> ${i.now}</div>
      ${i.sources?.length ? `<div class="sources">${i.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join('')}</div>` : ''}
    </article>
  `).join('');
}

function generate() {
  const year = document.getElementById('year').value.trim();
  const results = pickForYear(year).sort((a,b) => a.category.localeCompare(b.category));
  render(results, year);
  addSeen(year, results.map(r => r.id));
  const url = new URL(window.location);
  url.searchParams.set('year', year);
  history.replaceState(null, '', url.toString());
}

// setup
(function init(){
  const p = new URLSearchParams(location.search);
  const guess = p.get('year') || (new Date().getFullYear() - 28); // default guess
  const input = document.getElementById('year');
  input.value = guess;
  document.getElementById('go').addEventListener('click', (e)=>{ e.preventDefault(); generate(); });
  const moreBtn = document.getElementById('more');
  if (moreBtn) moreBtn.addEventListener('click', (e)=>{ e.preventDefault(); generate(); });

  const quick = document.getElementById('quick');
  const samples = [1965, 1975, 1985, 1995, 1997, 2005, 2010, 2015];
  quick.innerHTML = samples.map(y => `<span class="chip" data-year="${y}">${y}</span>`).join('');
  quick.addEventListener('click', e => {
    const y = e.target?.dataset?.year; if (!y) return; input.value = y; generate();
  });

  // auto run once
  generate();
})();
</script>
