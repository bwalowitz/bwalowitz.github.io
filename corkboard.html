<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corkboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Subtle cork texture + grid */
    .cork {
      background-image:
        radial-gradient(circle at 25% 20%, rgba(0,0,0,0.05) 0 2px, transparent 3px),
        radial-gradient(circle at 60% 70%, rgba(0,0,0,0.04) 0 1.5px, transparent 2.5px),
        linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
      background-size: 12px 12px, 18px 18px, var(--grid) var(--grid), var(--grid) var(--grid);
      background-position: 0 0, 0 0, 0 0, 0 0;
      background-color: #D2B48C;
    }
    .pin-dot { box-shadow: 0 0 0 2px rgba(0,0,0,0.15); }
    /* Prevent text selection while dragging */
    .no-select { user-select: none; -webkit-user-select: none; -ms-user-select: none; }
  </style>
</head>
<body class="antialiased text-neutral-900 bg-neutral-100 min-h-screen">
  <div class="w-full h-screen flex flex-col">
    <!-- Top bar -->
    <div class="flex items-center gap-2 border-b border-neutral-200 px-3 py-2 bg-white/90 backdrop-blur">
      <h1 class="text-lg font-semibold">Corkboard</h1>
      <div class="ml-auto flex items-center gap-2">
        <button id="btn-toggle-add" class="px-3 py-1.5 text-sm rounded-md border shadow-sm bg-white hover:bg-neutral-50">+ Add card</button>
        <button id="btn-reset" class="px-3 py-1.5 text-sm rounded-md border shadow-sm bg-white hover:bg-neutral-50">Reset demo layout</button>
        <button id="btn-open-json" class="px-3 py-1.5 text-sm rounded-md border shadow-sm bg-white hover:bg-neutral-50">Open JSON</button>
        <button id="btn-import" class="px-3 py-1.5 text-sm rounded-md border shadow-sm bg-white hover:bg-neutral-50">Import JSON</button>
        <input id="file-input" type="file" accept="application/json,.json" class="hidden" />
      </div>
    </div>

    <!-- Add card panel -->
    <div id="add-panel" class="hidden border-b border-neutral-200 p-3 bg-neutral-50">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-2 items-end">
        <div class="md:col-span-2">
          <label class="text-xs font-medium text-neutral-600">Title</label>
          <input id="add-title" class="w-full mt-1 rounded-md border px-3 py-2 text-sm" placeholder="Card title" />
        </div>
        <div>
          <label class="text-xs font-medium text-neutral-600">Type</label>
          <select id="add-type" class="w-full mt-1 rounded-md border px-3 py-2 text-sm bg-white">
            <option value="character">Character</option>
            <option value="location">Location</option>
            <option value="beat">Beat</option>
            <option value="note">Note</option>
          </select>
        </div>
        <div class="md:col-span-2">
          <label class="text-xs font-medium text-neutral-600">Description</label>
          <input id="add-desc" class="w-full mt-1 rounded-md border px-3 py-2 text-sm" placeholder="Optional short description" />
        </div>
        <div class="md:col-span-5 flex gap-2">
          <button id="btn-add" class="px-3 py-1.5 text-sm rounded-md bg-black text-white hover:opacity-90">Add</button>
          <button id="btn-cancel-add" class="px-3 py-1.5 text-sm rounded-md border">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Scroll area -->
    <div class="relative flex-1 overflow-auto">
      <div id="board" class="relative m-6 rounded-2xl shadow-inner cork" style="--grid: 16px; width: 2400px; height: 1600px;">
        <div class="pointer-events-none absolute inset-0 rounded-2xl ring-8 ring-[rgba(96,64,32,0.25)]"></div>
        <!-- Cards render here -->
      </div>
    </div>
  </div>

  <script>
    // --- State ---------------------------------------------------
    const storageKey = 'corkboard-standalone';
    let gridSize = 16;
    let boardSize = { width: 2400, height: 1600 };

    const TYPE_STYLES = {
      character: { bg: 'bg-rose-50', ring: 'ring-rose-300', pill: 'bg-rose-200 text-rose-900' },
      location:  { bg: 'bg-emerald-50', ring: 'ring-emerald-300', pill: 'bg-emerald-200 text-emerald-900' },
      beat:      { bg: 'bg-indigo-50', ring: 'ring-indigo-300', pill: 'bg-indigo-200 text-indigo-900' },
      note:      { bg: 'bg-amber-50', ring: 'ring-amber-300', pill: 'bg-amber-200 text-amber-900' },
    };

    const DEMO = [
      { id: 'c1', type: 'character', title: 'Mary Nichols', description: 'Protagonist. Rookie detective.', x: 80, y: 80 },
      { id: 'c2', type: 'location',  title: '5th St. Diner', description: 'Late-night meet spot.', x: 420, y: 140 },
      { id: 'c3', type: 'beat',      title: 'Inciting Incident', description: 'Anonymous tip calls in.', x: 220, y: 320 },
      { id: 'c4', type: 'note',      title: 'Tone', description: 'Neo-noir with warm highlights.', x: 680, y: 260 },
    ];

    let cards = load() || DEMO.slice();

    // --- Utils ---------------------------------------------------
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const snap  = (n, g) => Math.round(n / g) * g;
    function save() { localStorage.setItem(storageKey, JSON.stringify(cards)); }
    function load() {
      try { const raw = localStorage.getItem(storageKey); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }

    // --- Rendering -----------------------------------------------
    const boardEl = document.getElementById('board');
    function render() {
      boardEl.style.setProperty('--grid', gridSize + 'px');
      boardEl.style.width = boardSize.width + 'px';
      boardEl.style.height = boardSize.height + 'px';
      boardEl.innerHTML = '<div class="pointer-events-none absolute inset-0 rounded-2xl ring-8 ring-[rgba(96,64,32,0.25)]"></div>';
      for (const card of cards) {
        const s = TYPE_STYLES[card.type] || TYPE_STYLES.note;
        const el = document.createElement('div');
        el.className = `absolute select-none ${s.bg} ${s.ring} ring-1 shadow-sm rounded-xl p-3 cursor-grab active:cursor-grabbing`;
        el.style.left = card.x + 'px';
        el.style.top = card.y + 'px';
        el.style.width = '260px';
        el.dataset.id = card.id;
        el.dataset.x = card.x;
        el.dataset.y = card.y;

        el.innerHTML = `
          <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-neutral-800 pin-dot"></div>
          <div class="flex items-start gap-2">
            <span class="text-[10px] px-2 py-0.5 rounded-full ${s.pill} uppercase tracking-wide font-semibold">${card.type}</span>
          </div>
          <h3 class="mt-2 text-base font-semibold leading-tight">${escapeHtml(card.title)}</h3>
          ${card.description ? `<p class="mt-1 text-sm text-neutral-700">${escapeHtml(card.description)}</p>` : ''}
          <div class="mt-2 text-[11px] text-neutral-500">Double click to edit</div>
        `;

        attachCardHandlers(el, card);
        boardEl.appendChild(el);
      }
    }

    function escapeHtml(str) { return String(str).replace(/[&<>\\\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;'}[c])); }

    // --- Card interactions --------------------------------------
    function attachCardHandlers(el, card) {
      let isEditing = false;
      let startX = 0, startY = 0, cardStartX = 0, cardStartY = 0, moved = false;

      el.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || isEditing) return;
        startX = e.clientX; startY = e.clientY;
        cardStartX = card.x; cardStartY = card.y; moved = false;
        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointermove', (e) => {
        if (isEditing || !el.hasPointerCapture(e.pointerId)) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) moved = true;
        const nx = clamp(cardStartX + dx, 0, boardSize.width - 280);
        const ny = clamp(cardStartY + dy, 0, boardSize.height - 200);
        el.style.left = nx + 'px';
        el.style.top  = ny + 'px';
      });

      el.addEventListener('pointerup', (e) => {
        if (isEditing || e.button !== 0) return;
        if (moved) {
          const nx = snap(parseFloat(el.style.left), gridSize);
          const ny = snap(parseFloat(el.style.top), gridSize);
          card.x = nx; card.y = ny;
          save();
          render();
        } else {
          // Simple click behavior when not moved
          alert('Open detail view for card ' + card.id);
        }
      });

      el.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        if (isEditing) return; isEditing = true;
        const s = TYPE_STYLES[card.type] || TYPE_STYLES.note;
        el.classList.remove('cursor-grab','active:cursor-grabbing');
        el.innerHTML = `
          <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-neutral-800 pin-dot"></div>
          <div class="flex items-center gap-2 mb-2">
            <select id="edit-type" class="px-2 py-1 text-xs rounded-md border bg-white">
              <option value="character" ${card.type==='character'?'selected':''}>Character</option>
              <option value="location"  ${card.type==='location'?'selected':''}>Location</option>
              <option value="beat"      ${card.type==='beat'?'selected':''}>Beat</option>
              <option value="note"      ${card.type==='note'?'selected':''}>Note</option>
            </select>
            <span class="text-[10px] text-neutral-500">Editing</span>
          </div>
          <input id="edit-title" class="w-full rounded-md border px-3 py-2 text-sm mb-2" placeholder="Title" value="${escapeHtml(card.title)}" />
          <textarea id="edit-desc" class="w-full rounded-md border px-3 py-2 text-sm mb-2" rows="3" placeholder="Optional short description">${escapeHtml(card.description || '')}</textarea>
          <div class="flex gap-2">
            <button id="btn-save" class="px-3 py-1.5 text-sm rounded-md bg-black text-white hover:opacity-90">Save</button>
            <button id="btn-cancel" class="px-3 py-1.5 text-sm rounded-md border">Cancel</button>
            <button id="btn-delete" class="ml-auto px-3 py-1.5 text-sm rounded-md bg-red-600 text-white hover:opacity-90">Delete</button>
          </div>
        `;
        const titleEl = el.querySelector('#edit-title');
        const descEl  = el.querySelector('#edit-desc');
        const typeEl  = el.querySelector('#edit-type');
        const saveEl  = el.querySelector('#btn-save');
        const cancelEl= el.querySelector('#btn-cancel');
        const delEl   = el.querySelector('#btn-delete');
        titleEl && titleEl.focus();

        function saveEdit() {
          card.title = titleEl.value.trim() || card.title;
          card.description = descEl.value.trim() || undefined;
          card.type = typeEl.value;
          save();
          isEditing = false;
          render();
        }
        function cancelEdit() {
          isEditing = false; render();
        }
        function deleteCard() {
          if (!confirm('Delete this card?')) return;
          cards = cards.filter(c => c.id !== card.id);
          save();
          isEditing = false; render();
        }

        el.addEventListener('keydown', (ke) => {
          if (ke.key === 'Enter' && !ke.shiftKey) { ke.preventDefault(); saveEdit(); }
          if (ke.key === 'Escape') { ke.preventDefault(); cancelEdit(); }
        }, { once: true });
        saveEl.addEventListener('click', (e)=>{ e.stopPropagation(); saveEdit(); });
        cancelEl.addEventListener('click', (e)=>{ e.stopPropagation(); cancelEdit(); });
        delEl.addEventListener('click', (e)=>{ e.stopPropagation(); deleteCard(); });
      });
    }

    // --- Toolbar actions ----------------------------------------
    document.getElementById('btn-toggle-add').addEventListener('click', () => {
      const panel = document.getElementById('add-panel');
      const showing = !panel.classList.contains('hidden');
      panel.classList.toggle('hidden');
      document.getElementById('btn-toggle-add').textContent = showing ? '+ Add card' : 'Close';
      if (!showing) document.getElementById('add-title').focus();
    });

    document.getElementById('btn-cancel-add').addEventListener('click', () => {
      document.getElementById('add-panel').classList.add('hidden');
      document.getElementById('btn-toggle-add').textContent = '+ Add card';
    });

    document.getElementById('btn-add').addEventListener('click', () => {
      const title = document.getElementById('add-title').value.trim();
      const type  = document.getElementById('add-type').value;
      const desc  = document.getElementById('add-desc').value.trim();
      if (!title) return;
      const id = 'id_' + Date.now().toString(36);
      const nc = { id, type, title, description: desc || undefined, x: snap(120 + Math.random()*120, gridSize), y: snap(120 + Math.random()*80, gridSize) };
      cards.push(nc); save(); render();
      document.getElementById('add-title').value = '';
      document.getElementById('add-desc').value  = '';
      document.getElementById('add-panel').classList.add('hidden');
      document.getElementById('btn-toggle-add').textContent = '+ Add card';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      cards = DEMO.slice(); save(); render();
    });

    document.getElementById('btn-open-json').addEventListener('click', () => {
      const payload = { version: 1, exportedAt: new Date().toISOString(), board: { gridSize, boardSize }, cards };
      const json = JSON.stringify(payload, null, 2);
      // Open a blank tab synchronously and write JSON. Works in sandboxes.
      const w = window.open('', '_blank');
      if (!w) { alert('Popup was blocked. Allow popups to export.'); return; }
      w.document.open();
      w.document.write(`<!doctype html><html><head><meta charset="utf-8" /><title>corkboard.json</title><style>body{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace} pre{white-space:pre-wrap;word-wrap:break-word;padding:16px}</style></head><body><pre id="json"></pre></body></html>`);
      w.document.close();
      const pre = w.document.getElementById('json');
      if (pre) pre.textContent = json;
    });

    document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-input').click());

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data || !Array.isArray(data.cards)) throw new Error('Missing cards array');
          gridSize = data.board?.gridSize || gridSize;
          boardSize = data.board?.boardSize || boardSize;
          cards = data.cards.map(c => ({ x: 0, y: 0, description: '', ...c }));
          save(); render();
        } catch (err) {
          console.error(err); alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    // --- Kickoff -------------------------------------------------
    render();
  </script>
</body>
</html>
