<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C2C Margin Calculator — Simple</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 p-6">
  <div class="max-w-3xl mx-auto space-y-6">
    <header class="bg-white border rounded-xl p-5 shadow-sm">
      <h1 class="text-2xl font-bold">C2C Margin Calculator</h1>
      <p class="text-sm text-gray-600 mt-1">Formula: <span class="font-mono">Quote = Cost / (1 − Margin%)</span></p>
    </header>

    <!-- Forward calc -->
    <section class="bg-white border rounded-xl p-5 shadow-sm">
      <h2 class="text-xl font-semibold mb-3">Forward mode</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="block">
          <span class="text-sm font-medium">Cost</span>
          <input id="cost" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="800" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Target margin %</span>
          <input id="margin" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="20" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Round quote</span>
          <select id="round" class="mt-1 w-full rounded-lg border px-3 py-2">
            <option value="1">No rounding</option>
            <option value="5">Nearest $5</option>
            <option value="10" selected>Nearest $10</option>
            <option value="25">Nearest $25</option>
            <option value="50">Nearest $50</option>
            <option value="100">Nearest $100</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-medium">Accessorials (optional)</span>
          <input id="fees" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="0" />
        </label>
      </div>
      <div class="mt-4 flex gap-2">
        <button id="doCalc" class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">Calculate</button>
        <button id="copySummary" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Copy summary</button>
        <span id="copyNote" class="text-sm text-green-700 hidden">Copied</span>
      </div>
      <div class="bg-gray-50 border rounded-lg p-4 mt-4">
        <div class="flex justify-between"><span>Quote</span><strong id="quote">$0</strong></div>
        <div class="flex justify-between"><span>Profit</span><strong id="profit">$0</strong></div>
        <div class="flex justify-between"><span>Margin %</span><strong id="marginOut">0%</strong></div>
        <div class="flex justify-between"><span>Markup %</span><strong id="markup">0%</strong></div>
      </div>
    </section>

    <!-- Reverse calc -->
    <section class="bg-white border rounded-xl p-5 shadow-sm">
      <h2 class="text-xl font-semibold mb-3">Reverse check</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <label class="block">
          <span class="text-sm font-medium">Cost</span>
          <input id="rcost" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="800" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Quote</span>
          <input id="rquote" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="1000" />
        </label>
        <label class="block">
          <span class="text-sm font-medium">Target margin %</span>
          <input id="rtarget" type="number" class="mt-1 w-full rounded-lg border px-3 py-2" value="20" />
        </label>
      </div>
      <div class="mt-4 flex gap-2">
        <button id="doRC" class="px-4 py-2 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700">Calculate</button>
      </div>
      <div class="bg-gray-50 border rounded-lg p-4 mt-4">
        <div class="flex justify-between"><span>Margin %</span><strong id="rmargin">0%</strong></div>
        <div class="flex justify-between"><span>Profit</span><strong id="rprofit">$0</strong></div>
        <div class="flex justify-between"><span>Gap vs target</span><strong id="rgap">0%</strong></div>
      </div>
      <p id="rmsg" class="text-sm mt-2"></p>
    </section>
  </div>

  <script>
    const money = (n)=> new Intl.NumberFormat('en-US',{ style:'currency', currency:'USD', maximumFractionDigits:0 }).format(n);
    const pct = (n, d=1)=> (isFinite(n)? (n*100).toFixed(d) : '0') + '%';

    function roundTo(n, step){
      step = Number(step||1);
      if(step <= 1) return Math.round(n);
      return Math.round(n/step)*step;
    }

    function calcForward(){
      const cost = Number(document.getElementById('cost').value||0) + Number(document.getElementById('fees').value||0);
      const marginPct = Number(document.getElementById('margin').value||0)/100;
      const step = Number(document.getElementById('round').value||1);
      const quoteRaw = cost/(1 - marginPct || 1);
      const quote = roundTo(quoteRaw, step);
      const profit = Math.max(quote - cost, 0);
      const marginOut = profit/quote;
      const markup = profit/Math.max(cost, 1);

      document.getElementById('quote').textContent = money(quote);
      document.getElementById('profit').textContent = money(profit);
      document.getElementById('marginOut').textContent = pct(marginOut, 1);
      document.getElementById('markup').textContent = pct(markup, 1);

      return {cost, marginPct, quote, profit, marginOut, markup};
    }

    function copySummary(){
      const {cost, marginPct, quote, profit, marginOut, markup} = calcForward();
      const text = `Cost ${money(cost)} at target ${pct(marginPct,1)} -> Quote ${money(quote)} | Profit ${money(profit)} | Margin ${pct(marginOut,1)} | Markup ${pct(markup,1)}`;
      navigator.clipboard.writeText(text).then(()=>{
        const note = document.getElementById('copyNote');
        note.classList.remove('hidden');
        setTimeout(()=>note.classList.add('hidden'), 1200);
      });
    }

    function calcReverse(){
      const cost = Number(document.getElementById('rcost').value||0);
      const quote = Number(document.getElementById('rquote').value||0);
      const target = Number(document.getElementById('rtarget').value||0)/100;
      const profit = Math.max(quote - cost, 0);
      const margin = profit/Math.max(quote,1);
      const gap = margin - target;

      document.getElementById('rmargin').textContent = pct(margin, 1);
      document.getElementById('rprofit').textContent = money(profit);
      const gapEl = document.getElementById('rgap');
      gapEl.textContent = (gap>=0? '+':'') + pct(gap,1);
      gapEl.className = 'font-bold ' + (gap>=0? 'text-green-700':'text-red-700');

      const msg = document.getElementById('rmsg');
      if(gap >= 0){
        msg.textContent = 'You meet or beat the target.';
        msg.className = 'text-green-700';
      } else {
        const need = cost/(1 - target) - quote;
        msg.textContent = `Short of target. Increase quote by about ${money(Math.ceil(need))}.`;
        msg.className = 'text-red-700';
      }
    }

    // Buttons
    document.getElementById('doCalc').addEventListener('click', calcForward);
    document.getElementById('copySummary').addEventListener('click', copySummary);
    document.getElementById('doRC').addEventListener('click', calcReverse);
  </script>
</body>
</html>
